<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Designer | Bicycle Geometry Calculator with Physics</title>
    <meta name="description" content="An offline-first web application for calculating and rendering custom bicycle frame geometry with physics-based force and stress analysis.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Three.js WebGL Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Bike Designer<span>.</span></h1>
            </div>

            <div class="controls-wrapper">

                <!-- Frame & Angles -->
                <div class="control-group">
                    <h3>Frame & Angles</h3>

                    <div class="input-row">
                        <label for="seatTubeLength">Seat Tube (C-C)</label>
                        <div class="slider-container">
                            <input type="range" id="seatTubeLength" min="450" max="650" value="540" step="1">
                            <span class="value-display" id="seatTubeLengthVal">540</span><span class="unit">mm</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="effTopTubeLength">Effective Top Tube</label>
                        <div class="slider-container">
                            <input type="range" id="effTopTubeLength" min="480" max="650" value="550" step="1">
                            <span class="value-display" id="effTopTubeLengthVal">550</span><span class="unit">mm</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="seatTubeAngle">Seat Tube Angle</label>
                        <div class="slider-container">
                            <input type="range" id="seatTubeAngle" min="70" max="76" value="73" step="0.1">
                            <span class="value-display" id="seatTubeAngleVal">73</span><span class="unit">°</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="headTubeAngle">Head Tube Angle</label>
                        <div class="slider-container">
                            <input type="range" id="headTubeAngle" min="68" max="75" value="73" step="0.1">
                            <span class="value-display" id="headTubeAngleVal">73</span><span class="unit">°</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="chainStayLength">Chainstay Length</label>
                        <div class="slider-container">
                            <input type="range" id="chainStayLength" min="380" max="470" value="415" step="1">
                            <span class="value-display" id="chainStayLengthVal">415</span><span class="unit">mm</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="bbDrop">BB Drop</label>
                        <div class="slider-container">
                            <input type="range" id="bbDrop" min="40" max="90" value="70" step="1">
                            <span class="value-display" id="bbDropVal">70</span><span class="unit">mm</span>
                        </div>
                    </div>
                </div>

                <!-- Fork & Wheels -->
                <div class="control-group">
                    <h3>Fork & Wheels</h3>

                    <div class="input-row">
                        <label for="forkRake">Fork Rake (Offset)</label>
                        <div class="slider-container">
                            <input type="range" id="forkRake" min="30" max="60" value="43" step="1">
                            <span class="value-display" id="forkRakeVal">43</span><span class="unit">mm</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="wheelSize">Wheel Size (BSD)</label>
                        <select id="wheelSize">
                            <option value="622" selected>700c (622mm)</option>
                            <option value="584">650b (584mm)</option>
                            <option value="559">26" (559mm)</option>
                        </select>
                    </div>

                    <div class="input-row">
                        <label for="tireWidth">Tire Width</label>
                        <div class="slider-container">
                            <input type="range" id="tireWidth" min="23" max="55" value="28" step="1">
                            <span class="value-display" id="tireWidthVal">28</span><span class="unit">mm</span>
                        </div>
                    </div>
                </div>

                <!-- Rider & Load -->
                <div class="control-group">
                    <h3>Rider & Load</h3>

                    <div class="input-row">
                        <label for="riderWeight">Rider Weight</label>
                        <div class="slider-container">
                            <input type="range" id="riderWeight" min="50" max="150" value="75" step="1">
                            <span class="value-display" id="riderWeightVal">75</span><span class="unit">kg</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="saddleSetback">Saddle Setback</label>
                        <div class="slider-container">
                            <input type="range" id="saddleSetback" min="0" max="50" value="10" step="1">
                            <span class="value-display" id="saddleSetbackVal">10</span><span class="unit">mm</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="crankLength">Crank Length</label>
                        <div class="slider-container">
                            <input type="range" id="crankLength" min="160" max="180" value="170" step="1">
                            <span class="value-display" id="crankLengthVal">170</span><span class="unit">mm</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="powerOutput">Power Output</label>
                        <div class="slider-container">
                            <input type="range" id="powerOutput" min="100" max="1000" value="250" step="10">
                            <span class="value-display" id="powerOutputVal">250</span><span class="unit">W</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="brakingForce">Braking Force</label>
                        <div class="slider-container">
                            <input type="range" id="brakingForce" min="0.1" max="2.0" value="1.0" step="0.1">
                            <span class="value-display" id="brakingForceVal">1.0</span><span class="unit">g</span>
                        </div>
                    </div>
                </div>

                <!-- Frame Material -->
                <div class="control-group">
                    <h3>Frame Material</h3>

                    <div class="input-row">
                        <label for="frameMaterial">Material</label>
                        <select id="frameMaterial">
                            <option value="steel" selected>Steel (Yield: 250 MPa)</option>
                            <option value="aluminum">Aluminum (Yield: 200 MPa)</option>
                            <option value="carbon">Carbon (Yield: 500 MPa)</option>
                        </select>
                    </div>
                </div>

                <!-- Rider Fit -->
                <div class="control-group">
                    <h3>Rider Fit</h3>

                    <div class="input-row">
                        <label for="riderHeight">Rider Height</label>
                        <div class="slider-container">
                            <input type="range" id="riderHeight" min="150" max="200" value="175" step="1">
                            <span class="value-display" id="riderHeightVal">175</span><span class="unit">cm</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="riderInseam">Inseam</label>
                        <div class="slider-container">
                            <input type="range" id="riderInseam" min="70" max="90" value="80" step="1">
                            <span class="value-display" id="riderInseamVal">80</span><span class="unit">cm</span>
                        </div>
                    </div>

                    <div class="input-row">
                        <label for="ridingStyle">Riding Style</label>
                        <select id="ridingStyle">
                            <option value="road" selected>Road</option>
                            <option value="mtb">Mountain Bike</option>
                            <option value="touring">Touring</option>
                            <option value="cargo">Cargo</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button id="exportSvgBtn" class="btn-primary">Export Technical Image</button>
                <button id="compareBtn" class="btn-secondary">Lock Reference Geometry</button>
                <button id="exportDxfBtn" class="btn-secondary">Export as DXF (CAD)</button>
                <button id="exportStlBtn" class="btn-secondary">Export as STL (3D Print)</button>
                <button id="exportCsvBtn" class="btn-secondary">Export Specs (CSV)</button>
            </div>
        </aside>

        <!-- Visualization Canvas -->
        <main class="canvas-area">
            <div class="view-toggle-bar">
                <button id="view2dBtn" class="toggle-btn active">2D Blueprint</button>
                <button id="view3dBtn" class="toggle-btn">3D Viewport</button>
            </div>

            <div class="canvas-wrapper" id="canvasWrapper">
                <!-- SVG dynamically generated here -->
                <svg id="bikeSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
                    <!-- The background rect for export -->
                    <rect id="exportBg" width="100%" height="100%" fill="#111625" style="display:none;"></rect>
                    <!-- The geometry will map so that origin (0,0) is BB -->
                    <g id="bikeGroup">
                        <g id="gridGroup"></g>
                        <!-- Tube graphics -->
                        <g id="tubesGroup"></g>
                        <!-- Wheels graphic -->
                        <g id="wheelsGroup"></g>
                        <!-- Dimension Lines -->
                        <g id="dimensionsGroup"></g>
                    </g>
                    <!-- Non-flipped overlay for text / BOM -->
                    <g id="overlayGroup"></g>
                </svg>
            </div>

            <div class="canvas-wrapper" id="canvas3dWrapper" style="display: none;">
                <!-- WebGL Canvas will be dynamically appended here -->
            </div>

            <!-- Info Panel -->
            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">Trail</span>
                    <span class="info-value" id="trailDisplay">0 mm</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Wheelbase</span>
                    <span class="info-value" id="wheelbaseDisplay">0 mm</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Stack</span>
                    <span class="info-value" id="stackDisplay">0 mm</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Reach</span>
                    <span class="info-value" id="reachDisplay">0 mm</span>
                </div>
                <div class="info-item">
                    <span class="info-label">BB Torque</span>
                    <span class="info-value" id="bbTorqueDisplay">0 Nm</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ST Stress</span>
                    <span class="info-value" id="seatTubeStressDisplay">0 MPa</span>
                </div>
                <div class="info-item">
                    <span class="info-label">HT Force</span>
                    <span class="info-value" id="headTubeForceDisplay">0 N</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Safety Factor</span>
                    <span class="info-value" id="safetyFactorDisplay">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Stability</span>
                    <span class="info-value" id="stabilityScoreDisplay">0/10</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/geometry.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/renderer-3d.js"></script>
    <script src="js/dxf-exporter.js"></script>
    <script src="js/stl-exporter.js"></script>
    <script src="js/csv-exporter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
